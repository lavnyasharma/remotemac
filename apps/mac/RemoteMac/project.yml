name: RemoteMac
options:
  bundleIdPrefix: app.remotemac
configs:
  Debug: debug
  Release: release
packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC
    version: 153.0.0
targets:
  RemoteMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: App
      - path: UI
      - path: Networking
      - path: Security
      - path: Config
      - path: Assets.xcassets
    dependencies:
      - package: WebRTC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.remotemac.mac
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        ENABLE_HARDENED_RUNTIME: true
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSUIElement: true
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_CFBundleDisplayName: RemoteMac
